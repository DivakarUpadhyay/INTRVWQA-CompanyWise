<title>Teradyne Mock Interview</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #dde2ea;
  --accent: #0b6e8a; --accent-ink: #ffffff; --good: #1f7a45; --warn: #a65d00; --code: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #1a2029; --ink: #e5e9f0; --muted: #9aa5b5; --line: #2c3442;
    --accent: #4fb3cf; --accent-ink: #0d1117; --good: #5cc98a; --warn: #f0a845; --code: #232b37;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a2029; --ink: #e5e9f0; --muted: #9aa5b5; --line: #2c3442;
  --accent: #4fb3cf; --accent-ink: #0d1117; --good: #5cc98a; --warn: #f0a845; --code: #232b37;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 1.35rem; margin: 0; }
.sub { color: var(--muted); font-size: .9rem; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
select, input, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=search] { flex: 1 1 180px; min-width: 0; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
.bar > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .85rem; flex-wrap: wrap; }
.q { font-size: 1.25rem; font-weight: 600; margin: 10px 0 16px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.over { color: var(--warn); }
.answer { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; overflow-wrap: anywhere; }
.answer pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
.answer code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
.answer pre code { background: none; padding: 0; }
.answer table { border-collapse: collapse; width: 100%; font-size: .88rem; display: block; overflow-x: auto; }
.answer td, .answer th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.answer blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.row .spacer { flex: 1; }
.tag { font-size: .8rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); }
.tag.good { color: var(--good); border-color: var(--good); }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.notes { width: 100%; min-height: 70px; margin-top: 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.kbd { color: var(--muted); font-size: .8rem; margin-top: 12px; }
</style>

<script>
const CARDS = [{"id":"Q1","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Tell me about yourself.","a":"**Model answer (≈90 s):**\n\"I'm Divakar, a senior software engineer with about 11 years on the Microsoft stack: C#, VB.NET, .NET Framework through .NET 8 and 10, and SQL Server.\n\nFor the last few years I've been in Taiwan. From 2022 to early 2025 I was on-site at Acer through Skywind, maintaining Acer's Contact Service System, which the repair centres and partners use all over Taiwan. A big part of that job was production support: finding why an EDI integration with FedEx or TNT failed on certain documents, fixing it, and owning the UAT and release cycle with Acer's PMs.\n\nMost recently I was a senior engineer at AMG, building a .NET 8 platform until the company closed its operations in September. On my own time I built a smart-manufacturing platform in .NET 10 that talks to equipment over OPC UA, Modbus and MQTT and does SPC and OEE, because I like working close to hardware and factories.\n\nThis role combines what I'm strongest at, Windows, .NET and VB, and debugging production software, with the semiconductor industry I want to move into. That's why I applied.\""},{"id":"Q2","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Why Teradyne?","a":"\"Three reasons. First, Teradyne is the market leader in semiconductor test, and nearly every chip from Taiwan's fabs and OSATs goes through a tester like UltraFLEX, so the work matters. Second, the stack matches me: IG-XL runs on Windows, Excel, VB and .NET, which is where I've spent my career. Third, I want to work closer to hardware. I built a manufacturing platform on my own to learn that domain, and Teradyne would let me do it professionally, including the robotics side with Universal Robots, which I find exciting.\""},{"id":"Q3","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Why are you leaving / why are you available now?","a":"\"My last company, AMG, was a Web3 company. It closed its operations in September 2026 for regulatory and banking reasons outside the engineering team's control. So I'm available immediately, and I'm looking for a stable, long-term role in a strong engineering company.\"\n*(Keep it short and neutral. Don't criticise the company.)*"},{"id":"Q4","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Do you need a visa or sponsorship?","a":"\"No. I hold a Taiwan Employment Gold Card, so I can work for any employer without sponsorship.\""},{"id":"Q5","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Do you speak Mandarin?","a":"\"My Mandarin is basic. I'm learning, but my working language is English. At Acer I worked daily with Taiwanese PMs and engineers in English and written Chinese with translation tools, and it worked well. Could you tell me how much of the customer communication in this role is in Mandarin?\""},{"id":"Q6","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Are you OK with travel and customer sites?","a":"\"Yes. Visiting customer sites is often the fastest way to reproduce an issue, so I'm comfortable with travel in Taiwan, Asia and the US.\""},{"id":"Q7","group":"ROUND 1 – HR / Recruiter screen","src":"Mock","q":"Expected salary?","a":"\"Based on my experience and the market for senior engineers, I'm looking for around TWD 150k per month, depending on the full package: bonus, profit sharing and stock purchase. I'm flexible for the right role.\""},{"id":"Q8","group":"ROUND 2 – Hiring manager","src":"Mock","q":"Walk me through a project that relates to this role.","a":"**Model answer, Acer (STAR):**\n- **Situation:** \"Acer's Contact Service System is used by repair centres across Taiwan to log, track and ship repairs. I was the on-site senior engineer from 2022 to 2025.\"\n- **Task:** \"Keep it running and extend it, including shipping integrations with FedEx and TNT over EDI and a DHL payment gateway, plus a full localisation rollout.\"\n- **Action:** \"Most of the hard work was diagnosing failures in production. For example, some EDI shipments were rejected only for [certain partner formats]. I compared the raw EDI messages from logs against the spec, found that [a field / encoding / segment terminator] was produced differently for [those cases], fixed the generator, added validation before sending, and added a regression test with the real failing samples.\"\n- **Result:** \"Rejections for that format dropped to [near zero], and the repair centres stopped having to re-key shipments by hand. I also built SSRS reports so the business could see failures themselves instead of asking IT.\"\n- **Link to the role:** \"That's very similar to supporting a test-program environment: the customer's line is waiting, you need a reproduction, a root cause, and a fix that doesn't break anything else.\""},{"id":"Q9","group":"ROUND 2 – Hiring manager","src":"Mock","q":"Describe the hardest bug you've debugged.","a":"**Model answer (structure: symptom → hypothesis → tools → root cause → fix → prevention):**\n\"A Windows service in production [at Skywind/Acer or your real case] would stop processing after a few days, but CPU was idle and nothing was in the logs.\n- I captured a **hang dump** with ProcDump (`procdump -ma \u003cpid>`) while it was stuck.\n- In **WinDbg** I loaded SOS, ran `!threads` and `~*e !clrstack`, and saw that the worker threads were all blocked waiting on the same lock, while one thread was blocked on a synchronous `.Result` call to an async HTTP method.\n- Root cause: a **sync-over-async deadlock** plus a lock held across the network call. When the remote API was slow, everything piled up behind it.\n- Fix: made the call path async end to end, removed the lock around I/O, and added a timeout and a cancellation token.\n- Prevention: added a health-check endpoint and an alert if the queue stopped draining for 5 minutes.\nIt took [2 days]. The lesson for me: when there are no errors, take a dump. Don't guess.\""},{"id":"Q10","group":"ROUND 2 – Hiring manager","src":"Mock","q":"How do you approach a customer issue you can't reproduce?","a":"\"1. **Collect everything first**: exact software version, OS, configuration, logs, Event Viewer entries, the input or test program if allowed, and the exact steps and timing.\n2. **Ask the customer to capture data at the moment of failure**: a ProcDump with `-e` for crashes, or DebugDiag crash/hang rules, Process Monitor traces for file or registry problems, and a datalog.\n3. **Compare environments**: what is different between their setup and mine? Version, 32/64-bit, regional settings, permissions, antivirus, add-ins, data size.\n4. **Build a minimal reproduction** by narrowing down: remove half of the inputs until it fails or stops failing.\n5. Keep the customer updated on what I know, what I'm trying next and when I'll update them, even if there's no fix yet.\""},{"id":"Q11","group":"ROUND 2 – Hiring manager","src":"Mock","q":"How strong is your Excel and VB?","a":"\"Strong. I've written VB.NET in production for years, at Tecogis for the IGI diamond-grading lab system and at Acer where part of the code base was VB.NET. In Excel I'm comfortable with VBA macros: working with ranges and arrays, dictionaries, events, and error handling. I've also automated report generation and data cleanup. I haven't written IG-XL VBT yet, but I understand it's VBA inside the test-program workbook, calling the IG-XL object model (`TheExec`, `TheHdw`) to drive instruments and judge limits. Coming from VB.NET, that's a short learning curve.\""},{"id":"Q12","group":"ROUND 2 – Hiring manager","src":"Mock","q":"What do you know about IG-XL and our testers?","a":"\"IG-XL is the Windows-based software environment for Teradyne's UltraFLEX, UltraFLEXplus, J750 and IntegraFLEX testers. A test program is an Excel workbook with sheets that describe the device and the test: the **pin map** and **channel map** connect device pins to tester channels; **DC/AC specs, pin levels and time sets** define voltages and timing; **test instances** say which template runs with which parameters; and the **flow table** decides the order of tests and the binning. The test logic is written in **VBT**, Visual Basic for Test, and newer versions also support .NET. Programs usually run **multi-site**, testing several devices in parallel, and the results go into datalogs, often STDF, that are used for yield analysis. I'd expect most issues I'd support to be in that layer: a test program behaving differently than expected, a crash or hang of the environment, or performance.\""},{"id":"Q13","group":"ROUND 2 – Hiring manager","src":"Mock","q":"Have you used ClearCase?","a":"\"Not in production. I use Git every day: GitHub, Azure DevOps, branching, pull requests, rebasing, resolving conflicts, and CI with GitHub Actions. I know ClearCase's model: VOBs as repositories, views (snapshot or dynamic) defined by a config spec, explicit checkout/checkin per file, and in UCM, streams and activities instead of branches. The concepts map onto Git, so I'd be productive quickly.\""},{"id":"Q14","group":"ROUND 2 – Hiring manager","src":"Mock","q":"How do you prioritise when several customers have issues at once?","a":"\"By impact first: a line-down issue, where production has stopped, beats everything. Then by number of systems affected, then by deadline. I'd make the priority visible to my manager and the customers, so nobody is surprised. While waiting on one customer for data, I work on the next issue.\""},{"id":"Q15","group":"ROUND 2 – Hiring manager","src":"Mock","q":"Tell me about a time you disagreed with a colleague or manager.","a":"\"At [Acer], a PM wanted to push a release with a known edge-case bug in the EDI generator because the date was fixed. I didn't just say no. I showed the data: how many shipments per week would hit that case, and the manual work for repair centres if they did. We agreed on a compromise: release on time with that one document type temporarily switched to the old path, then a patch a week later. The release went out, and nobody had to re-key shipments.\""},{"id":"Q16","group":"ROUND 2 – Hiring manager","src":"Mock","q":"What's your biggest weakness?","a":"\"I haven't worked on ATE or semiconductor test yet, so I have domain knowledge to build. I'm handling it actively. I've already studied how IG-XL test programs are structured and how testers work, and I learn domains fast: diamond grading, logistics EDI, healthcare APIs and smart manufacturing all came up in my career, and each time I became the person others asked within a few months.\""},{"id":"Q17","group":"ROUND 3 – Technical panel","src":"Mock","q":"Explain the four OOP principles with an example from your work.","a":"\"**Encapsulation**: hide state behind methods. In FactoryOS, a `Device` class keeps its connection private and only exposes `ReadTag()`.\n**Abstraction**: expose what, not how. An `IProtocolDriver` interface with `Connect`, `Read` and `Write`.\n**Inheritance**: share behaviour. A `TcpDriverBase` handles reconnection, and `ModbusDriver` and `S7Driver` inherit from it.\n**Polymorphism**: the ingestion engine calls `driver.Read()` without knowing which protocol it is. In a tester, that's like calling `instrument.Measure()` on any instrument type.\""},{"id":"Q18","group":"ROUND 3 – Technical panel","src":"Mock","q":"Interface vs abstract class?","a":"\"An interface is a contract with no state. A class can implement many interfaces. Since C# 8 interfaces can have default methods, but still no instance fields. An abstract class can hold state, constructors and shared implementation, but a class can inherit only one. I use interfaces for capabilities and testability (`IInstrument`), and an abstract base class when several implementations share real code.\""},{"id":"Q19","group":"ROUND 3 – Technical panel","src":"Mock","q":"Value type vs reference type? Boxing?","a":"\"Value types (`struct`, `int`, `double`) hold their data directly and are copied on assignment. They usually live on the stack or inline in an object. Reference types (`class`) live on the heap, and variables hold a reference. Boxing wraps a value type in an object on the heap, for example putting an `int` in an `object` or a non-generic `ArrayList`. That costs an allocation, which matters in tight loops, like processing thousands of measurements per site. Generics avoid it.\""},{"id":"Q20","group":"ROUND 3 – Technical panel","src":"Mock","q":"How does garbage collection work? What is IDisposable for?","a":"\"The .NET GC is generational: gen 0 for new objects, gen 1, gen 2 for long-lived ones, plus the Large Object Heap for objects of 85 KB and larger. It collects managed memory automatically but knows nothing about unmanaged resources such as file handles, sockets, COM objects or instrument sessions. `IDisposable` with `using` releases them deterministically. A finalizer is only a safety net. In a COM-heavy environment like Excel automation, you also have to release COM objects (`Marshal.ReleaseComObject` or let them go out of scope and collect), or Excel processes stay alive.\""},{"id":"Q21","group":"ROUND 3 – Technical panel","src":"Mock","q":"What causes memory leaks in .NET?","a":"\"Mostly references that are kept alive by mistake: event handlers never unsubscribed (the publisher keeps the subscriber alive), static collections or caches that only grow, timers, unmanaged handles never disposed, and COM objects never released. To find one, I take two dumps some time apart, or use dotnet-gcdump, and compare `!dumpheap -stat`. Then `!gcroot` on a growing type shows who holds it.\""},{"id":"Q22","group":"ROUND 3 – Technical panel","src":"Mock","q":"`async/await`: what happens, and what is a deadlock with `.Result`?","a":"\"`await` frees the thread while the I/O runs and resumes the method later. If code blocks with `.Result` or `.Wait()` on a thread that has a synchronization context, such as a UI thread or old ASP.NET, the continuation needs that same thread, which is blocked, so it deadlocks. Fixes: async all the way, or `ConfigureAwait(false)` in library code.\""},{"id":"Q23","group":"ROUND 3 – Technical panel","src":"Mock","q":"Thread safety: how would you protect a shared counter / collection?","a":"\"For a counter, `Interlocked.Increment`. For a collection, `ConcurrentDictionary` or `ConcurrentQueue`, or a `lock` around a short critical section. Never hold a lock during I/O. To avoid deadlocks, always take locks in the same order and keep them short.\""},{"id":"Q24","group":"ROUND 3 – Technical panel","src":"Mock","q":"Pointer vs reference?","a":"\"A pointer can be null, can be reseated and needs `*` to dereference. A reference must be bound at initialisation, can't be null in correct code and can't be reseated. I use references for parameters that must exist, and pointers (preferably smart pointers) when ownership or 'no object' matters.\""},{"id":"Q25","group":"ROUND 3 – Technical panel","src":"Mock","q":"What is RAII? Smart pointers?","a":"\"Resource Acquisition Is Initialization: a resource is tied to an object's lifetime. The constructor acquires it and the destructor releases it, so cleanup happens even on exceptions. Smart pointers apply it to memory: `unique_ptr` for single ownership, `shared_ptr` with reference counting for shared ownership, `weak_ptr` to break cycles. It's the C++ equivalent of `using`/`IDisposable`.\""},{"id":"Q26","group":"ROUND 3 – Technical panel","src":"Mock","q":"Why should a base class have a virtual destructor?","a":"\"If you delete a derived object through a base pointer and the destructor isn't virtual, only the base destructor runs. That's undefined behaviour, and in practice the derived part leaks. Any class meant to be used polymorphically needs a virtual destructor.\""},{"id":"Q27","group":"ROUND 3 – Technical panel","src":"Mock","q":"Common causes of a C++ crash, and how do you find them?","a":"\"Null or dangling pointers (use after free), buffer overruns, double delete, stack overflow from deep recursion, and unhandled exceptions. To find them: get a crash dump with ProcDump `-e` or WER LocalDumps, open it in WinDbg with matching **symbols (PDBs)**, run `!analyze -v`, and look at the faulting stack with `k`. For heap corruption, enable **PageHeap** with `gflags /p /enable app.exe /full`, so the crash happens at the bad write instead of later.\""},{"id":"Q28","group":"ROUND 3 – Technical panel","src":"Mock","q":"Write a VBA function that finds all failing values in a column and returns their count. (live)","a":"See `04-Coding-Practice/vba/Drills.bas` (Drill 1). Talking points: read the range into an array (`rng.Value`) instead of cell-by-cell (much faster), `Option Explicit`, typed variables, handle a single-cell range, and `IsNumeric` checks."},{"id":"Q29","group":"ROUND 3 – Technical panel","src":"Mock","q":"How do you make VBA fast?","a":"\"Read and write ranges as arrays in one call, don't use `Select` or `Activate`, turn off `Application.ScreenUpdating`, set `Calculation` to manual during bulk work and restore it in an error handler, use `Dictionary` for lookups instead of nested loops, and avoid `Variant` where a typed variable works. In test code, the time-critical part is avoiding unnecessary instrument setup inside loops, and in multi-site work, operating on all sites at once instead of looping per site where the API allows it.\""},{"id":"Q30","group":"ROUND 3 – Technical panel","src":"Mock","q":"How do you handle errors in VBA?","a":"\"`On Error GoTo Handler` with a single exit point that restores state (ScreenUpdating, Calculation, open files), logs `Err.Number`, `Err.Description` and the procedure name, then either re-raises with `Err.Raise` or returns a failure code. `On Error Resume Next` only around one specific line that may fail, immediately followed by checking `Err.Number` and `On Error GoTo 0`.\""},{"id":"Q31","group":"ROUND 3 – Technical panel","src":"Mock","q":"VBA vs VB.NET differences you watch for?","a":"\"VBA arrays can have any lower bound and default to `Option Base 0`, but `Range.Value` returns 1-based 2D arrays. `Set` is required for object assignment. There's no real inheritance in VBA, only interfaces via `Implements`. Integer is 16-bit in VBA, so use `Long`. And error handling is `On Error` instead of `Try/Catch`.\""},{"id":"Q32","group":"ROUND 3 – Technical panel","src":"Mock","q":"A customer says their VBT test program became slower after an IG-XL upgrade. How do you investigate?","a":"\"1. Get both versions' timing data. IG-XL can report test times per instance, and I'd compare instance by instance to find which tests got slower instead of looking at the total.\n2. Check whether it's in the customer's VBT code or in the system: run a standard/reference program on both versions.\n3. For the slow instances, look for setup that's repeated unnecessarily, such as levels or timing loaded inside loops, or per-site loops where a multi-site call exists, and for datalog or debug settings that were turned on.\n4. If it's in our software, reproduce it in-house with a minimal program, profile it, and hand it to the development team with the data.\n5. Communicate a workaround to the customer as soon as there is one.\""},{"id":"Q33","group":"ROUND 3 – Technical panel","src":"Mock","q":"An application crashes randomly on a customer's tester PC. Walk me through it.","a":"\"1. **Event Viewer**, Application log: the crash event shows the faulting module and exception code, for example `0xC0000005` access violation or `0xE0434352` .NET exception.\n2. **Capture a dump**: `procdump -e -ma -w app.exe C:\\dumps`, or set WER LocalDumps in the registry, or a DebugDiag crash rule.\n3. **Analyse in WinDbg**: set symbols (`.symfix`, plus our PDB path), `!analyze -v`, `k` for the native stack. For .NET, `.loadby sos clr` (or `coreclr`), then `!pe` for the exception and `!clrstack`.\n4. Identify whether the faulting module is ours, the customer's code, or a third-party DLL or driver.\n5. Reproduce it with that knowledge, fix it, and confirm on the customer's setup.\""},{"id":"Q34","group":"ROUND 3 – Technical panel","src":"Mock","q":"The application hangs (not responding, CPU low). What do you do?","a":"\"Low CPU usually means waiting, so a deadlock or blocked I/O. I take 2–3 hang dumps a few seconds apart (`procdump -ma \u003cpid>` or DebugDiag hang rule). In WinDbg, `~*k` shows all thread stacks, `!locks` shows critical sections for native code, and `!syncblk` shows held managed locks. If the same threads are waiting in every dump, that's the deadlock. I look for a lock-order problem or a UI thread blocked on a background thread. **High CPU** instead means a busy loop: Process Explorer's thread tab shows which thread, and `!runaway` in WinDbg shows thread CPU times.\""},{"id":"Q35","group":"ROUND 3 – Technical panel","src":"Mock","q":"Which Sysinternals tools do you use and for what?","a":"\"**Process Explorer**: who has a file or DLL open, handles, threads, which DLL versions are loaded. **Process Monitor**: file, registry and process activity, perfect for 'access denied', 'file not found' or a missing config. Filter on the process and on `Result is not SUCCESS`. **ProcDump**: dumps on crash, hang or CPU threshold. **Autoruns**: what starts at boot, for conflicts. **TCPView**: network connections. **Handle**: handle counts from the command line, for handle leaks. **VMMap**: memory breakdown, managed vs native vs images.\""},{"id":"Q36","group":"ROUND 3 – Technical panel","src":"Mock","q":"Memory keeps growing over a long test run. How do you find the leak?","a":"\"First decide which kind: Performance Monitor counters, or Process Explorer columns (Private Bytes vs .NET heap size, handle count, GDI objects). If the managed heap grows, take two dumps and compare `!dumpheap -stat`, then `!gcroot` on the growing type. If native memory grows, use a **DebugDiag leak rule** or `!heap -s`, and UMDH with user stack traces enabled in gflags. If the **handle count** grows, `!htrace` or Handle.exe. Typical culprits in this environment: COM objects not released, event subscriptions, and caches that never shrink.\""},{"id":"Q37","group":"ROUND 3 – Technical panel","src":"Mock","q":"What are symbols and why do you need them?","a":"\"PDB files map addresses to function names, source files and line numbers. Without them a stack is just `module+0x1234`. You need the **exact matching** PDB for the build. That's why build systems should archive PDBs to a symbol server. In WinDbg: `.sympath srv*C:\\symbols*https://msdl.microsoft.com/download/symbols;C:\\ourbuild\\pdbs`, then `.reload`.\""},{"id":"Q38","group":"ROUND 3 – Technical panel","src":"Mock","q":"32-bit vs 64-bit issues you've seen?","a":"\"A 64-bit process can't load a 32-bit DLL in-process. You see a `BadImageFormatException` in .NET, or a COM class 'not registered' because it is registered only in the other registry view (`WOW6432Node`). There are also two copies of `System32`/`SysWOW64` and of Excel bitness, so VBA `Declare` statements need `PtrSafe` and `LongPtr` in 64-bit Office. I check bitness with Process Explorer or `dumpbin /headers`.\""},{"id":"Q39","group":"ROUND 3 – Technical panel","src":"Mock","q":"How do you find which commit introduced a bug?","a":"\"`git bisect`: mark a good and a bad commit, Git checks out the midpoint, I test, and in a few steps it finds the commit. Also `git log -S \"text\"` to find when a line appeared, and `git blame` for who changed a line and why.\""},{"id":"Q40","group":"ROUND 3 – Technical panel","src":"Mock","q":"Merge vs rebase?","a":"\"Merge keeps history as it happened, with a merge commit. Rebase replays my commits on top of the target for a linear history. I rebase my private feature branch to stay current, and merge or squash into shared branches. I never rebase a branch others have pulled.\""},{"id":"Q41","group":"ROUND 3 – Technical panel","src":"Mock","q":"Design a tool that collects test results from many testers and shows yield per lot. (likely variant of their \"design a system\" question)","a":"**Model answer, structured:**\n1. **Clarify:** how many testers, result format (STDF datalog files), real-time or batch, who uses it (product engineers), retention.\n2. **Ingestion:** a small Windows service on each tester or a file share watcher picks up closed STDF files and pushes them to a queue. It must be idempotent: file hash as key, so retries don't duplicate.\n3. **Parsing:** a worker parses STDF records (lot, wafer, site, part/bin results, parametric values) and writes them to SQL Server. Bin summary goes to a normal table, parametric data to a columnstore or partitioned table, because it's large.\n4. **API + UI:** yield by lot, wafer map, bin Pareto, per-site comparison (a site with lower yield points to a hardware/contact problem).\n5. **Non-functional:** testers must never be slowed down, so collection is asynchronous and low priority. Buffer locally if the network is down. Monitor queue length.\n6. Tie it to your experience: \"I built a similar pipeline in FactoryOS: device ingestion → queue → columnstore telemetry table → live dashboards and SPC.\""},{"id":"Q42","group":"ROUND 3 – Technical panel","src":"Mock","q":"Design an ATM system (reported Teradyne question). Classes only.","a":"\"Classes: `ATM` (has `CardReader`, `CashDispenser`, `Keypad`, `Screen`, `ReceiptPrinter`), `Bank` (via an `IBankService` interface), `Account` (subclasses `CheckingAccount`, `SavingsAccount`), `Card`, `Transaction` (abstract) with subclasses `Withdrawal`, `Deposit`, `BalanceInquiry`, `Transfer`, each overriding `Execute()`. Use the **State pattern** for the ATM (`Idle`, `CardInserted`, `PinVerified`, `Transaction`, `OutOfService`). Key points: PIN verified by the bank, not the ATM; withdrawal is a two-phase operation (authorise, dispense, then confirm, and reverse if the dispense fails); concurrency on the account is handled in the bank with a transaction or row lock; every step is logged for audit.\""},{"id":"Q43","group":"ROUND 4 – Final / behavioural","src":"Mock","q":"Tell me about a time you had to learn something new quickly.","a":"\"At Tecogis I joined the IGI diamond-grading project with no gemology knowledge. Within [a month] I learned the grading workflow (the 4Cs, certificates, lab sync) well enough to design the grading portal with e-signature, a camera library for stone images and Rapaport pricing. I learn by reading the domain docs, sitting with the users, and building a small prototype early. I've done the same for ATE before this interview: I studied the test-program structure and the IG-XL concepts.\""},{"id":"Q44","group":"ROUND 4 – Final / behavioural","src":"Mock","q":"Tell me about a time you handled an unhappy customer.","a":"\"At Acer, a repair-centre partner escalated because shipments were stuck for [two days] during a peak. I called them, acknowledged the impact, and agreed to update them every two hours. I found that [a carrier's API change] was causing it, put in a temporary manual path the same day so shipments could move, and shipped the real fix the next day. Afterwards I added monitoring, so we'd see it before they did. They were calmer because they always knew the status, even before we had the fix.\""},{"id":"Q45","group":"ROUND 4 – Final / behavioural","src":"Mock","q":"Tell me about a mistake you made.","a":"\"Early in my career I deployed a database change without testing it on a production-sized copy. A query that ran in milliseconds in test took minutes in production and slowed the site. I rolled back, added the missing index, and since then I always test schema changes against realistic data volume and keep a rollback script ready. That habit has saved me several times since.\""},{"id":"Q46","group":"ROUND 4 – Final / behavioural","src":"Mock","q":"Where do you see yourself in 5 years?","a":"\"As a senior engineer that both customers and the development team trust for this platform, someone who knows IG-XL and the testers deeply, mentors new engineers, and builds tools that make the support work faster.\""},{"id":"Q47","group":"ROUND 4 – Final / behavioural","src":"Mock","q":"Do you have any questions for us?","a":"Always yes. See `01-Overview/Questions-To-Ask.md`."},{"id":"01-1","group":"C#, .NET, C++ and OOP","src":"Bank","q":"What is the CLR? JIT?","a":"The Common Language Runtime runs .NET code. It loads assemblies, verifies IL, JIT-compiles IL to native code method by method on first call, and manages memory (GC), exceptions, threads and security. Crash dumps of .NET apps need SOS because the CLR's data structures sit on top of native memory."},{"id":"01-2","group":"C#, .NET, C++ and OOP","src":"Bank","q":"What is an assembly? The GAC?","a":"An assembly is a compiled unit (.dll/.exe) with IL + metadata + a manifest (name, version, culture, public key token). The Global Assembly Cache (in .NET Framework) holds strong-named shared assemblies. Version conflicts (\"could not load file or assembly … or one of its dependencies\") are solved with binding redirects in `app.config` and diagnosed with **Fusion Log Viewer (fuslogvw)**. .NET Core/5+ has no GAC and uses `deps.json`."},{"id":"01-3","group":"C#, .NET, C++ and OOP","src":"Bank","q":"How does .NET talk to COM / Excel / native DLLs?","a":"- **COM interop**: a Runtime Callable Wrapper (RCW) wraps the COM object, so you release it with `Marshal.ReleaseComObject`/`FinalReleaseComObject`, otherwise Excel stays in Task Manager.\n- **P/Invoke**: `[DllImport(\"x.dll\")]` to call native C functions. Watch the calling convention, string marshalling (`CharSet`) and struct layout (`StructLayout`).\n- **C++/CLI**: a mixed assembly that wraps native C++ classes for .NET.\nIG-XL is a mix of Excel/VBA (COM), native code and .NET, so this matters."},{"id":"01-4","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`string` vs `StringBuilder`?","a":"Strings are immutable, so concatenating in a loop allocates every time. Use `StringBuilder` for building strings in loops (e.g. building a datalog line per site)."},{"id":"01-5","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`const` vs `readonly` vs `static readonly`?","a":"`const` is compile-time and baked into callers (changing it requires recompiling callers). `readonly` is set in the constructor per instance. `static readonly` is set once per type at runtime."},{"id":"01-6","group":"C#, .NET, C++ and OOP","src":"Bank","q":"What are delegates and events? Lambdas?","a":"A delegate is a type-safe function pointer (`Func\u003c>`, `Action\u003c>`). An event is a delegate that only the owner can raise, while others subscribe with `+=`. Remember to unsubscribe with `-=` to avoid leaks. Lambdas are inline anonymous functions and can capture variables (closures). Beware capturing loop variables in older C# `for` loops."},{"id":"01-7","group":"C#, .NET, C++ and OOP","src":"Bank","q":"LINQ deferred execution?","a":"Most LINQ operators run only when enumerated. Enumerating twice runs the query twice (twice the DB calls or file reads). Use `.ToList()` to materialise once."},{"id":"01-8","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Exceptions best practice?","a":"Catch only what you can handle, keep the stack with `throw;` not `throw ex;`, use specific exception types, don't use exceptions for normal flow (slow), log with context, and add a global handler (`AppDomain.UnhandledException`, `TaskScheduler.UnobservedTaskException`) that writes a log before crash."},{"id":"01-9","group":"C#, .NET, C++ and OOP","src":"Bank","q":"SOLID in one line each","a":"- **S**ingle responsibility – one reason to change.\n- **O**pen/closed – extend by adding classes, not editing working code.\n- **L**iskov – subclasses must work wherever the base works.\n- **I**nterface segregation – small focused interfaces.\n- **D**ependency inversion – depend on abstractions; inject them."},{"id":"01-10","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Design patterns you've used?","a":"Repository + Unit of Work (data access with Dapper), Strategy (protocol drivers in FactoryOS), Factory (creating the right driver from config), Observer (events / SignalR live updates), Singleton (via DI lifetime, not static), State (workflow/ATM), Adapter (wrapping carrier APIs FedEx/TNT behind one interface)."},{"id":"01-11","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`Dispose` pattern code","a":"```csharp\npublic sealed class InstrumentSession : IDisposable\n{\n    private IntPtr _handle;          // unmanaged resource\n    private bool _disposed;\n\n    public void Dispose()\n    {\n        if (_disposed) return;\n        NativeClose(_handle);\n        _handle = IntPtr.Zero;\n        _disposed = true;\n        GC.SuppressFinalize(this);\n    }\n    ~InstrumentSession() => NativeClose(_handle);   // safety net only\n    private static void NativeClose(IntPtr h) { /* ... */ }\n}\n```"},{"id":"01-12","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Stack vs heap?","a":"Stack: automatic, fast, freed at scope end, limited size (default 1 MB on Windows, so deep recursion causes stack overflow `0xC00000FD`). Heap: `new`/`delete` or smart pointers, lifetime controlled by you, slower, can fragment or leak."},{"id":"01-13","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`new/delete` vs `malloc/free`?","a":"`new` calls constructors and is type-safe. `malloc` only allocates bytes. Never mix them (`delete` on `malloc` memory = undefined behaviour). Use `delete[]` for arrays from `new[]`."},{"id":"01-14","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Rule of 3 / 5 / 0?","a":"If a class manages a resource and defines one of destructor, copy constructor or copy assignment, it needs all three (Rule of 3). Add move constructor and move assignment (Rule of 5). Best: use RAII members (`unique_ptr`, `vector`) so you need none of them (Rule of 0)."},{"id":"01-15","group":"C#, .NET, C++ and OOP","src":"Bank","q":"What is a vtable?","a":"Each class with virtual functions has a table of function pointers, and each object has a hidden pointer (vptr) to its class's table. A virtual call looks up the function at runtime. In WinDbg, `dps` on an object's first pointer shows its vtable, which is useful to identify a corrupted or already-freed object."},{"id":"01-16","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`const` correctness?","a":"`const T&` parameters to avoid copies and promise no change. `const` member functions don't modify the object. It helps the compiler and readers."},{"id":"01-17","group":"C#, .NET, C++ and OOP","src":"Bank","q":"`std::vector` vs `std::list`?","a":"`vector`: contiguous, cache-friendly, fast random access, amortised O(1) push_back. Inserting in the middle is O(n), and iterators are invalidated on reallocation, a classic crash. `list`: O(1) insert anywhere but poor cache use. Default to `vector`."},{"id":"01-18","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Undefined behaviour examples","a":"Reading uninitialised variables, out-of-bounds access, use-after-free, signed integer overflow, data races, returning a reference to a local. These often \"work\" in Debug and crash in Release."},{"id":"01-19","group":"C#, .NET, C++ and OOP","src":"Bank","q":"Debug vs Release crash differences?","a":"Debug initialises memory with patterns (`0xCCCCCCCC` uninitialised stack, `0xCDCDCDCD` uninitialised heap, `0xDDDDDDDD` freed heap, `0xFEEEFEEE` freed by HeapFree). Seeing these values in a register in a dump tells you what happened. Release optimises, so variables may be missing in the debugger."},{"id":"02-1","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Module vs class module vs sheet module?","a":"Standard module: public procedures and functions. Class module: defines an object (properties, methods, `Implements` for interfaces). Sheet/ThisWorkbook module: event handlers (`Worksheet_Change`, `Workbook_Open`)."},{"id":"02-2","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"`Sub` vs `Function`?","a":"A `Function` returns a value and can be used as a worksheet formula (UDF). A `Sub` doesn't return a value. Both can take `ByRef` (default in VBA!) or `ByVal` parameters. Default `ByRef` surprises VB.NET developers, where the default is `ByVal`."},{"id":"02-3","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"`Option Explicit` – why?","a":"It forces variable declaration, so a typo (`resutl`) becomes a compile error instead of a new empty Variant. Always on."},{"id":"02-4","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Data types to remember","a":"`Integer` is 16-bit (max 32,767), so use `Long`. `LongLong`/`LongPtr` are for 64-bit. `Double` for measurements. `Variant` can hold anything, including arrays and `Empty`/`Null`/`Error`. Use `Currency` for fixed-point."},{"id":"02-5","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Dynamic arrays","a":"```vba\nDim v() As Double\nReDim v(1 To n)\nReDim Preserve v(1 To n + 10)   ' only the LAST dimension can be resized with Preserve\n```"},{"id":"02-6","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Dictionary / Collection?","a":"`Scripting.Dictionary` (late bound: `CreateObject(\"Scripting.Dictionary\")`) has `.Exists`, `.Keys` and `.Items`, and gives O(1) lookups. Use it for counting bins or grouping. `Collection` is built in but has no `Exists` and is slower to search."},{"id":"02-7","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Early vs late binding?","a":"Early: reference added (Tools → References), typed objects, IntelliSense, faster. Late: `As Object` + `CreateObject`, no reference needed, avoids version conflicts between machines. Use late binding for distribution, early binding while developing."},{"id":"02-8","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"How to find the last used row?","a":"`lastRow = ws.Cells(ws.Rows.Count, \"A\").End(xlUp).Row`. More reliable than `UsedRange`, which can include formatted empty cells."},{"id":"02-9","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"How to read a CSV / text file fast?","a":"`Open path For Input As #f` + `Line Input`, or `FileSystemObject.OpenTextFile`, or read the whole file with `Input$(LOF(f), f)` then `Split(text, vbCrLf)`. For big data, `Workbooks.OpenText` or Power Query."},{"id":"02-10","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Calling Windows API from VBA (64-bit Office)?","a":"```vba\n#If VBA7 Then\n    Private Declare PtrSafe Function GetTickCount64 Lib \"kernel32\" () As LongLong\n#Else\n    Private Declare Function GetTickCount Lib \"kernel32\" () As Long\n#End If\n```\nPointers and handles must be `LongPtr` in 64-bit."},{"id":"02-11","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"How do you debug VBA?","a":"Breakpoints (F9), step (F8), Immediate window (`?var`, `Debug.Print`), Watch and Locals windows, `Stop` statement, and `Debug.Assert condition`. For timing, `Timer` or `GetTickCount64`."},{"id":"02-12","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Excel automation from C#?","a":"Use `Microsoft.Office.Interop.Excel` (or late-bound `dynamic`), always release COM objects, avoid two dots (`xl.Workbooks.Open` creates a hidden RCW), and call `Quit`. For server-side work use OpenXML/ClosedXML instead, since Office automation is not supported unattended."},{"id":"02-13","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"What is a test program in IG-XL?","a":"An Excel workbook (`.igxl` / `.xlsm` style) loaded by IG-XL. Typical sheets:\n| Sheet | Purpose |\n|---|---|\n| Pin Map | Device pin names and pin groups |\n| Channel Map | Which tester channel/instrument each pin connects to, per site (multi-site) |\n| DC Specs / AC Specs / Global Specs | Named values (e.g. VDD = 1.2 V, period = 10 ns), with selectors (min/typ/max) |\n| Pin Levels | VIL/VIH/VOL/VOH, power supply levels per pin |\n| Time Sets | Waveform timing per pin for digital patterns |\n| Test Instances | Each test: which template (VBT or built-in), with which arguments, patterns, levels and timing |\n| Flow Table | Order of execution, pass/fail branching, binning |\n| Bin Table | Maps pass/fail results to hardware/software bins |\n| Job List | Which flow/sheets make up a job (e.g. wafer sort vs final test) |"},{"id":"02-14","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"What is VBT?","a":"Visual Basic for Test: VBA code inside the test program. You write **test templates/functions** that use the IG-XL object model, roughly:\n- `TheExec` – execution context: flow, sites, datalog, limits (`TheExec.Flow.TestLimit` to judge a value against limits and datalog it), error handling.\n- `TheHdw` – hardware: instruments (DC power supplies, PPMU, digital pins, patterns).\n- Site-aware data types such as `SiteDouble` and `PinListData`, so one call returns values for all active sites. Multi-site code should loop over **active** sites only, because failed sites get disabled."},{"id":"02-15","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"What is multi-site testing and why does it matter for software?","a":"Testing several devices (sites) in parallel to increase throughput. Software must handle per-site data, sites that fail early and are removed, and keep site results separated in the datalog. Bugs often show up as \"site 3 always fails\", which can be the hardware (channel/contact) or code that indexes sites wrongly."},{"id":"02-16","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"Typical VBT test function shape (pseudocode)","a":"```vba\nPublic Function Leakage_Test(pins As PinList, vForce As Double) As Long\n    On Error GoTo errHandler\n    ' 1. connect / set up instrument (PPMU) on the pins\n    ' 2. force voltage vForce, wait settling time\n    ' 3. measure current on all active sites -> site-aware result\n    ' 4. TheExec.Flow.TestLimit result, lowLimit, highLimit   ' judge + datalog\n    ' 5. disconnect / restore\n    Exit Function\nerrHandler:\n    ' report through TheExec error mechanism, never leave instruments connected\n    If AbortTest Then Exit Function Else Resume Next\nEnd Function\n```\n(The exact API is in the IG-XL help. In the interview, explain the steps, not exact signatures.)"},{"id":"02-17","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"What can go wrong in VBT programs (support-type issues)?","a":"- Instruments left in a bad state after an error (no cleanup), so the next test fails.\n- Wrong settling time, which makes measurements flaky only on some testers.\n- Hard-coded site numbers, which break when the site count changes.\n- Debug prints/datalog left on, causing slow test time.\n- Version differences after an IG-XL upgrade (deprecated APIs).\n- 32/64-bit `Declare` issues in VBA.\n- Excel itself: add-ins, macro security, corrupt workbook, references missing on another PC."},{"id":"02-18","group":"Excel, VBA and IG-XL VBT","src":"Bank","q":"What is STDF?","a":"Standard Test Data Format, the binary datalog standard in semiconductor test. Records include MIR (lot info), PIR/PRR (part start/result with bin), PTR (parametric result), FTR (functional), and WIR/WRR (wafer). Used for yield analysis."},{"id":"03-1","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Access violation in our DLL, only on one customer's tester.","a":"`!analyze -v` → faulting instruction and stack in our module. `lmvm ourdll` to confirm the version matches what we think they have (often they run a different patch!). Check whether the pointer is null (`0x0`) or a freed-memory pattern. If heap corruption is suspected, ask for a repro with PageHeap (`gflags /p /enable app.exe /full`), so it breaks at the bad write. Compare their environment, such as a third-party DLL or driver version, and look for `lm` modules that are not on our machine."},{"id":"03-2","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Excel (hosting the test program) crashes on close.","a":"Classic causes: COM objects not released by an add-in or .NET code, events still connected, a background thread touching Excel objects. Dump on crash → stack usually shows the add-in DLL. Process Explorer → DLL view to list add-ins. Try with add-ins disabled (`excel /safe`)."},{"id":"03-3","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"\"Access denied\" / \"file not found\" errors with no detail.","a":"**Process Monitor**: filter `Process Name is app.exe` and `Result is not SUCCESS`, look for `ACCESS DENIED`, `NAME NOT FOUND`, `PATH NOT FOUND` on files or registry keys near the time of the error. This also finds missing DLL dependencies (a long list of `NAME NOT FOUND` while probing for a DLL)."},{"id":"03-4","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Which DLL version is actually loaded?","a":"Process Explorer → lower pane DLL view (View → Lower Pane View → DLLs), or `lm` in WinDbg, or `listdlls.exe app.exe`."},{"id":"03-5","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Handle leak?","a":"Process Explorer \"Handles\" column growing, or `handle -s -p app.exe` for counts by type. In WinDbg: `!htrace -enable`, run for a while, then `!htrace -diff` gives the stacks that opened handles never closed."},{"id":"03-6","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"GDI/User objects leak (UI eventually stops drawing)?","a":"Task Manager → Details → add \"GDI objects\" / \"USER objects\" columns. The default limit is 10,000 per process. Look for fonts, brushes and bitmaps not disposed."},{"id":"03-7","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Application is slow, not hung.","a":"Measure first: Performance Monitor counters (CPU, disk, .NET GC % time, exceptions/sec), then a profiler (Visual Studio Profiler, PerfView, dotnet-trace). High \"% time in GC\" points to too many allocations. Many first-chance exceptions/sec means exceptions used for flow control."},{"id":"03-8","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Event Viewer, what do you look at?","a":"Windows Logs → Application: \"Application Error\" (Event ID 1000, faulting module + offset + exception code), \".NET Runtime\" (Event ID 1026, managed stack trace!), \"Windows Error Reporting\" (1001). System log for driver, disk and service failures."},{"id":"03-9","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"DebugDiag vs WinDbg?","a":"DebugDiag automates capture (rules) and gives readable HTML analysis reports, which is good for customers and first triage, especially leaks and IIS hangs. WinDbg is for deep manual analysis. I usually start with a DebugDiag/ProcDump capture and go to WinDbg when I need detail."},{"id":"03-10","group":"Windows Debugging (WinDbg, DebugDiag, Sysinternals)","src":"Bank","q":"Remote / live debugging?","a":"Attach WinDbg to the live process (`F6`), or run it remotely with `.server` / `-remote`. In production, prefer dumps: attaching freezes the process and stops the tester."},{"id":"04-1","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Explain your daily Git workflow.","a":"\"Pull the latest main, create a feature branch (`feature/ticket-123`), make small commits with clear messages, rebase on main before pushing, open a pull request, get review and CI green, then squash-merge. Hotfixes branch from the release tag and are merged back to main.\""},{"id":"04-2","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"How do you undo things?","a":"| Situation | Command |\n|---|---|\n| Unstage a file | `git restore --staged file` |\n| Discard local changes in a file | `git restore file` |\n| Fix the last commit message (not pushed) | `git commit --amend` |\n| Undo a pushed commit safely | `git revert \u003csha>` (new commit, history preserved) |\n| Move branch back locally (not pushed) | `git reset --soft/--mixed/--hard \u003csha>` |\n| Recover \"lost\" commits | `git reflog` |"},{"id":"04-3","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Resolve a merge conflict?","a":"Open the conflicted files, understand both sides (talk to the other author if needed), edit, then `git add` and continue (`git merge --continue` / `git rebase --continue`). Build and run tests before pushing. Never resolve blindly by picking \"ours\"."},{"id":"04-4","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Cherry-pick?","a":"`git cherry-pick \u003csha>` copies one commit onto the current branch. Used to bring a bug fix into a release branch for a customer patch."},{"id":"04-5","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Tags and releases?","a":"Annotated tags (`git tag -a v10.2.1 -m ...`) mark exactly what was shipped. Essential for support: you must be able to rebuild and get the symbols of the version a customer runs."},{"id":"04-6","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Large binary files?","a":"Git LFS. ClearCase handles binaries natively, which is one reason hardware companies used it."},{"id":"04-7","group":"Version Control (Git/GitHub and ClearCase)","src":"Bank","q":"Branching strategy for a product with several supported versions (like IG-XL releases)?","a":"A main/development branch, plus **release branches per supported version** (`release/10.40`). Fixes go to the oldest supported release that needs them and are merged or cherry-picked forward. Every customer build is tagged, with its PDBs archived on a symbol server."},{"id":"05-1","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"What is ATE?","a":"Automated Test Equipment: a system that applies signals (voltages, currents, digital patterns, RF, analog waveforms) to a chip, the **DUT (device under test)**, measures the responses, and decides pass/fail and which **bin** the part goes into. It runs thousands of tests per device in milliseconds to seconds, so **test time = cost**."},{"id":"05-2","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"Where does testing happen in the flow?","a":"1. **Wafer sort / CP (chip probe)**: on the whole wafer, a **probe card** touches each die, and a **prober** moves the wafer. Bad dies are marked (wafer map, ink or electronic map).\n2. Dies are cut, packaged (assembly at OSATs like ASE, SPIL, Amkor).\n3. **Final test / FT**: packaged parts are tested, a **handler** picks and places them into sockets on a **load board** (DIB, device interface board).\n4. Sometimes **SLT (system-level test)**, where the chip is tested in a real system. Teradyne also does SLT."},{"id":"05-3","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"What kinds of tests?","a":"- **Continuity / opens-shorts**: are all pins connected? (Usually first, cheap, protects the tester.)\n- **Leakage (IIL/IIH)**: tiny currents on input pins.\n- **Power / IDD / IDDQ**: supply current in various modes.\n- **DC parametric**: VOL/VOH, output voltages and currents with **PPMU** (per-pin parametric measurement unit).\n- **Functional / digital**: run **patterns** (vectors) through the digital pins at speed and compare outputs with expected values.\n- **Scan / ATPG**: structural tests of internal logic via scan chains.\n- **Analog / mixed-signal / RF**: ADC/DAC linearity, PLL, SerDes, RF power.\n- **Memory BIST / repair**.\n- **Trim / fuse**: adjust analog values and burn fuses per chip."},{"id":"05-4","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"What is binning?","a":"Each part ends in a **hard bin** (handler bin, physical) and a **soft bin** (detailed reason). Bin 1 is usually good. Speed binning puts faster parts in more expensive bins."},{"id":"05-5","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"What is yield?","a":"Good parts / tested parts. Small yield changes are worth millions, so engineers watch yield per lot, wafer and **site**. A site that yields worse than the others usually means a hardware/contact problem, not the chip."},{"id":"05-6","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"Multi-site?","a":"Testing 2, 4, 8 … up to hundreds of devices in parallel to cut cost. **Multi-site efficiency** measures how close it is to perfect parallelism. Software and VBT code must be site-aware."},{"id":"05-7","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"Teradyne products to know","a":"| Product | Area |\n|---|---|\n| **UltraFLEX / UltraFLEXplus** | High-end SoC test (processors, mobile/AP, networking, AI chips), runs **IG-XL** |\n| **J750 / J750Ex-HD** | High-volume, low-cost digital/microcontroller test, runs IG-XL |\n| **IntegraFLEX** | IG-XL based mixed-signal/analog platform |\n| **Magnum** | Memory test (DRAM, flash) |\n| **ETS** (Eagle Test Systems) | Analog/power devices |\n| **Titan / SLT** | System-level test |\n| Universal Robots, MiR | Cobots and mobile robots (Teradyne Robotics) |\n\nTeradyne's main competitor is **Advantest** (V93000 platform, SmarTest software). It is fine to mention you know the market has two big players."},{"id":"05-8","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"Why does software matter so much in ATE?","a":"The tester is only as good as its test program. Software controls test time (cost), correlation between testers, datalogs for yield, and how fast customers can bring up new chips (**time to market**). A crash in IG-XL on a production floor stops a whole test cell, which is very expensive, so debugging skills are critical."},{"id":"05-9","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"Common terms","a":"DUT, DIB/load board, probe card, prober, handler, test cell, pattern/vector, time set, levels (VIL, VIH, VOL, VOH), PPMU, DCVI/DCVS (DC source instruments), shmoo plot (pass/fail across voltage × frequency), guardband, correlation (golden units), STDF datalog, OSAT, CP/FT, test time, multi-site efficiency, yield, bin."},{"id":"05-10","group":"ATE and Semiconductor Test Basics","src":"Bank","q":"How does your FactoryOS experience relate?","a":"Same ideas at a different scale: collecting data from equipment (OPC UA, Modbus, MQTT, S7), real-time dashboards, SPC (control charts and Cp/Cpk, which are also used on parametric test data), OEE (availability × performance × quality; for a tester, downtime and test time are the cost), alarms and maintenance. You understand why uptime and throughput on a production floor matter."}];
const KEY = "teradyne-mock-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const rate = id => (store[id] && store[id].r) || "";

const $ = s => document.querySelector(s);
const groups = [...new Set(CARDS.map(c => c.group))];
for (const g of groups) { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#group").append(o); }

let list = [], idx = 0, shown = false, t0 = 0, tick = null;

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
}
function md(src) {
  const lines = src.split("\n"); let html = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>"; continue; }
    if (/^\|/.test(l)) {
      let rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      rows = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r));
      html += "<table>" + rows.map((r, k) => "<tr>" + r.replace(/^\||\|$/g, "").split("|").map(c => (k ? "<td>" : "<th>") + inline(c.trim()) + (k ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>";
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      html += (ordered ? "<ol>" : "<ul>") + items.map(x => "<li>" + inline(x) + "</li>").join("") + (ordered ? "</ol>" : "</ul>");
      continue;
    }
    if (/^>/.test(l)) { html += "<blockquote>" + inline(l.replace(/^>\s?/, "")) + "</blockquote>"; i++; continue; }
    if (!l.trim()) { i++; continue; }
    let para = []; while (i < lines.length && lines[i].trim() && !/^(```|\||>|\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    html += "<p>" + inline(para.join(" ")) + "</p>";
  }
  return html;
}

function build() {
  const mode = $("#mode").value, g = $("#group").value, q = $("#search").value.toLowerCase().trim();
  list = CARDS.filter(c => (!g || c.group === g) && (!q || (c.q + " " + c.a).toLowerCase().includes(q)));
  if (mode === "weak") list = list.filter(c => rate(c.id) === "weak");
  if (mode === "unseen") list = list.filter(c => !rate(c.id));
  if (mode === "random") list = list.map(c => [Math.random(), c]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  idx = 0; render();
}

function stats() {
  const good = CARDS.filter(c => rate(c.id) === "good").length, weak = CARDS.filter(c => rate(c.id) === "weak").length;
  $("#stats").innerHTML = `<span>${CARDS.length} questions</span><span>✓ ${good} confident</span><span>! ${weak} needs work</span><span>${CARDS.length - good - weak} not rated</span>`;
  $("#bar").style.width = (100 * good / CARDS.length) + "%";
}

function startTimer() {
  clearInterval(tick); t0 = Date.now();
  const lim = +$("#limit").value;
  tick = setInterval(() => {
    const el = $("#timer"); if (!el) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` + (lim ? ` / ${Math.floor(lim / 60)}:${String(lim % 60).padStart(2, "0")}` : "");
    el.classList.toggle("over", lim > 0 && s > lim);
  }, 250);
}

function render() {
  stats(); shown = false;
  if (!list.length) { $("#view").innerHTML = `<div class="card empty">No questions match. Change the mode, topic or search.</div>`; clearInterval(tick); return; }
  const c = list[idx], r = rate(c.id), note = (store[c.id] && store[c.id].n) || "";
  $("#view").innerHTML = `
    <div class="card">
      <div class="meta"><span>${esc(c.group)} · ${esc(c.id)}</span><span>${idx + 1} / ${list.length} · <span class="timer" id="timer">0:00</span></span></div>
      <div class="q">${inline(c.q)}</div>
      ${r ? `<span class="tag ${r === "good" ? "good" : "warn"}">${r === "good" ? "Confident" : "Needs work"}</span>` : ""}
      <div class="answer" id="ans" hidden>${md(c.a)}</div>
      <textarea class="notes" id="notes" placeholder="Your own notes / key words for this answer (saved in this browser)">${esc(note)}</textarea>
      <div class="row">
        <button class="primary" id="reveal">Show model answer</button>
        <button id="good">✓ Confident</button>
        <button id="weak">! Needs work</button>
        <span class="spacer"></span>
        <button id="prev" ${idx === 0 ? "disabled" : ""}>← Prev</button>
        <button id="next">Next →</button>
      </div>
    </div>`;
  $("#reveal").onclick = toggle;
  $("#good").onclick = () => mark("good");
  $("#weak").onclick = () => mark("weak");
  $("#prev").onclick = () => go(-1);
  $("#next").onclick = () => go(1);
  $("#notes").oninput = e => { store[c.id] = Object.assign(store[c.id] || {}, { n: e.target.value }); save(); };
  startTimer();
}

function toggle() { shown = !shown; $("#ans").hidden = !shown; $("#reveal").textContent = shown ? "Hide answer" : "Show model answer"; }
function mark(v) { const c = list[idx]; store[c.id] = Object.assign(store[c.id] || {}, { r: v }); save(); go(1); }
function go(d) { if (!list.length) return; idx = Math.max(0, Math.min(list.length - 1, idx + d)); render(); }

document.addEventListener("keydown", e => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "1") mark("good");
  else if (e.key === "2") mark("weak");
});
["#mode", "#group", "#limit"].forEach(s => $(s).onchange = build);
$("#search").oninput = build;
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};
build();
</script>
</body>
</html>
